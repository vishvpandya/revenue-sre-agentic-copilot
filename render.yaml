services:
  - type: web
    name: revenue-sre-api
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn recovery_orchestrator.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
