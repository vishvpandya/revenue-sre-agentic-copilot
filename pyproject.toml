[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "recovery-orchestrator"
version = "0.1.0"
description = "A bounded, audited agentic revenue-recovery platform for the Razorpay Buildathon."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "google-genai>=2.3,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "razorpay>=1.4,<2",
  # Razorpay 1.4 still imports pkg_resources, removed from newer setuptools.
  "setuptools>=75,<81",
  "streamlit>=1.49,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
recovery-api = "recovery_orchestrator.api:run"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recovery_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
